name: Build MotoVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare exact MotoVerse branding
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cat app/src/main/logo_parts/part0.b64 app/src/main/logo_parts/part1.b64 app/src/main/logo_parts/part2.b64 app/src/main/logo_parts/part3.b64 | base64 -d > app/src/main/assets/motoverse_logo.jpg
          cp app/src/main/assets/motoverse_logo.jpg app/src/main/res/drawable-nodpi/motoverse_icon.jpg
          file app/src/main/assets/motoverse_logo.jpg
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('app/src/main/assets/motoverse_logo.jpg')
          im.verify()
          print('MotoVerse logo verified')
          PY
          sed -i 's/motoverse_logo\.webp/motoverse_logo.jpg/g' app/src/main/assets/firebase-bridge.js

      - name: Prepare fixed debug signing key
        run: |
          base64 -d app/src/main/motoverse_debug_keystore.b64 > app/motoverse-debug.keystore

      - name: Apply runtime fixes
        run: |
          printf '\n' >> app/src/main/assets/firebase-bridge.js
          cat app/src/main/assets/fixes-v17.js >> app/src/main/assets/firebase-bridge.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        env:
          MV_ALERT_WEBHOOK_URL: ${{ secrets.MV_ALERT_WEBHOOK_URL }}
        run: gradle assembleDebug

      - name: Verify signing certificate
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload MotoVerse APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoVerse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
