name: Build MotoVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare exact MotoVerse logo
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          base64 -d app/src/main/motoverse_logo.b64 > app/src/main/assets/motoverse_logo.webp
          cp app/src/main/assets/motoverse_logo.webp app/src/main/res/drawable-nodpi/motoverse_logo.webp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        env:
          MV_ALERT_WEBHOOK_URL: ${{ secrets.MV_ALERT_WEBHOOK_URL }}
        run: gradle assembleDebug

      - name: Upload MotoVerse APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoVerse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
