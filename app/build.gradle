plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def alertWebhookUrl = System.getenv('MV_ALERT_WEBHOOK_URL') ?: 'https://script.google.com/macros/s/AKfycbwG2w3n9i3YLN8Y-QArZ949Ca6y1D2PTjXO4PoMGWAWoP6A8aL9RtuwGf3hlCVcL9dATQ/exec'

android {
    namespace 'pt.motoverse.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('motoverse-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'pt.motoverse.app'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '1.10.0'
        buildConfigField 'String', 'ALERT_WEBHOOK_URL', '"' + alertWebhookUrl + '"'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
